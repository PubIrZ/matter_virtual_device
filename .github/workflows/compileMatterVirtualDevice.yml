# # =========================================================================
# # NOMBRE DEL WORKFLOW DE COMPILACIÓN
# # Se mostrará con este título en la pestaña "Actions" de tu repositorio.
# # =========================================================================
# <name: Integración Continua (Compilación)
# # El trigger se activa al hacer push/pull sobre la rama principal (el trigger vigila cambios en cualquier punto de la rama)
# # (en particular se activará cuando el bot del unzip termine el push de subir los archivos descomprimidos)
# on:
#   push:
#     branches: [ "main" ]  # Ejecuta este workflow cada vez que alguien suba código "definitivo" (push) a la rama main
#   pull_request:
#     branches: [ "main" ]  # Ejecuta este workflow cuando alguien proponga cambios a través de un Pull Request dirigido hacia la rama main


# =========================================================================
# NOMBRE DEL WORKFLOW DE COMPILACIÓN
# Se mostrará con este título en la pestaña "Actions" de tu repositorio.
# =========================================================================
name: Compilación Manual del Proyecto

# =========================================================================
# TRIGGER MANUAL CON EL ÚNICO INPUT INTERACTIVO REQUERIDO
# Mantenemos exclusivamente el checkbox para forzar el borrado de la caché.
# Los demás parámetros técnicos quedan fijos de fondo de forma persistente.
# =========================================================================
on:
  workflow_dispatch:
    inputs:
      clear_cache:
        description: 'Marcar para FORZAR el borrado de la caché y compilar en limpio desde cero'
        required: false
        type: boolean
        default: false

# =========================================================================
# PARAMETROS FIJOS PERSISTENTES (VARIABLES DE ENTORNO GLOBALES)
# Centralizamos aquí los parámetros que cambies rara vez y viajen en el código.
# Variable env, se ven en todos los steps del script
# =========================================================================
env:
  VERSION_PROYECTO: "1.5.0-stable"    
  # WORKING_DIR: "."                         # Modificar si se usa una subcarpeta para contener el proyecto kotlin
  WORKING_DIR: "Matter_Virtual_Device"     # Modificar si se usa una subcarpeta para contener el proyecto kotlin
                                           # El punto (.) es buscar el proyecto directamente en la raíz (que es
                                           # lo que hace gradle por defecto)
  SKIP_JDK_VERSION_CHECK: "true"           # sdkmanager ignorará que estás en JDK 11 y procederá a aceptar las licencias
                                           # de tu SDK Platform 26 de forma limpia                                    

# =========================================================================
# ENTORNOS DE COMPILACIÓN Y PASOS EXECUTADOS POR EL RUNNER
# Configura el entorno base heredado: JDK 11, Android SDK API 26 y NDK r22b.
# =========================================================================
jobs:
  build:
    # Solicitamos a GitHub un runner limpio basado en una máquina virtual Linux (Ubuntu).
    runs-on: ubuntu-latest

    # -------------------------------------------------------------------
    # CONFIGURACIÓN GLOBAL DE DEFAULTS
    # Forzamos a que todos los comandos 'run' de este job se ejecuten de forma
    # automática dentro de la carpeta fijada arriba en ${{ env.WORKING_DIR }}.
    # Si no estuviese aquí habría que ponerlo en cada run de Gradle
    # -------------------------------------------------------------------
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      # -------------------------------------------------------------------
      # PASO 1: ACCIÓN DE CHECKOUT (DESCARGA DEL REPOSITORIO)
      # Clona el código de tu rama principal dentro del entorno del runner.
      # -------------------------------------------------------------------
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      # -------------------------------------------------------------------
      # PASO 2: INSTALACIÓN INICIAL DE JAVA 17
      # Necesario exclusivamente para que las herramientas del SDK de Android 
      # (sdkmanager) no arrojen errores de LinkageError al validar licencias.
      # -------------------------------------------------------------------
      - name: Configurar Java JDK 17 (Para herramientas de Android)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'


      # # -------------------------------------------------------------------
      # # PASO 3: CONFIGURACIÓN DEL ANDROID SDK Y EL NDK EXACTO
      # # Descarga y asocia la plataforma API 26 junto al NDK 22.1.7171670 (r22b).
      # # Mapea automáticamente variables críticas del sistema como ANDROID_HOME.
      # # -------------------------------------------------------------------
      # - name: Configurar Android SDK y NDK (Estilo v2)
      #   uses: android-actions/setup-android@v2
      #   with:
      #     api-level: 26
      #     ndk-version: 22.1.7171670

      # -------------------------------------------------------------------
      # PASO 3: CONFIGURACIÓN DEL ANDROID SDK Y EL NDK EXACTO (SINTAXIS V3 --setup-android@v3--)
      # Forzamos la aceptación automática de licencias para que el bot no se detenga.
      # Usamos el parámetro unificado 'packages' y su nomenclatura para descargar la API 26 y el NDK.
      # -------------------------------------------------------------------
      - name: Configurar Android SDK y NDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: >-
            platforms;android-26
            ndk;22.1.7171670
            
          #packages: 'platforms;android-26 ndk;22.1.7171670' <--- Nomenclatura alternativa 
          
      # -------------------------------------------------------------------
      # PASO 4: DOWNGRADE SEGURO A JAVA JDK 11 (TU ENTORNO REQUERIDO)
      # Modificamos el entorno de la máquina virtual para restaurar Java 11.
      # Activamos aquí tu caché condicional para agilizar tus futuros builds.
      # -------------------------------------------------------------------
      - name: Configurar Java JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          # =======================================================================
          # NOTA ARQUITECTURA DISTRIBUCIÓN:
          # Elegimos 'temurin' (Eclipse Adoptium) por ser la distribución recomendada
          # de GitHub para la action 'setup-java', ya que con ella la caché de Gradle se
          # integra de forma nativa con esta distribución. 
          #
          # Alternativas válidas si Gradle da errores heredados de compatibilidad: 
          # 'zulu' (Azul Systems, recomendada para entornos Android clásicos),
          # 'corretto' (Amazon), 'microsoft' o 'liberica'.
          # =====================================================================          
          distribution: 'temurin'
          cache: ${{ github.event.inputs.clear_cache == 'true' && '' || 'gradle' }}
          
      # -------------------------------------------------------------------
      # PASO 5: PERMISOS DE EJECUCIÓN AL WRAPPER DE GRADLE
      # Los sistemas Linux (como el runner) exigen permisos explícitos para
      # poder arrancar scripts binarios ejecutables.
      # Gracias al default global, Linux buscará './gradlew' dentro de tu WORKING_DIR.
      # -------------------------------------------------------------------
      # 
      # NOTA DIDACTICA SOBRE EL GRADLE WRAPPER (gradlew):
      # Usamos el script ejecutable './gradlew' del propio proyecto en lugar de
      # acciones como 'setup-gradle' porque el Wrapper encapsula la versión exacta 
      # de Gradle necesaria, garantizando la compatibilidad con Java 11.
      # El Wrapper es un script autoejecutable que ya lleva dentro la versión exacta 
      # de Gradle que necesita la aplicación. Es el propio Wrapper el que se descarga 
      # su motor de ejecución de Gradle (en ~/.gradle/) y compila el código.
      # (el runner ~/.gradle/ = /home/runner/.gradle/)
      # =======================================================================      
      - name: Otorgar permisos de ejecución a gradlew
        run: chmod +x gradlew

      # -------------------------------------------------------------------
      # PASO 6: DIAGNÓSTICO NATIVO DE LA VERSIÓN DE KOTLIN
      # Le pedimos directamente a Gradle que escanee sus plugins cargados
      # y nos pinte en pantalla la versión de Kotlin exacta del proyecto.
      # -------------------------------------------------------------------
      - name: Consultar versión de Kotlin detectada por Gradle
        run: ./gradlew buildEnvironment
        
      # -------------------------------------------------------------------
      # PASO 7: EJECUCIÓN DE LA COMPILACIÓN CON PARÁMETROS PERSISTENTES
      # - Mapeamos la variante leyendo la variable FIJA de los Ajustes web: vars.BUILD_VARIANT
      # - Mapeamos la versión leyendo el parámetro FIJO de la sección env: env.VERSION_PROYECTO
      # -------------------------------------------------------------------
      - name: Compilar con Gradle
        run: |
          # 1. Usamos una variante de compilación para indicar la tarea que pedimos a gradlew que compile.
          # 2. El flag -P sirve para inyectar una variable Gradle personalizada desde la línea de comandos hacia los build.gradle.
          # 3. '-PversionName=...' crea o sobrescribe una variable Gradle llamada versionName.
          ./gradlew ${{ vars.BUILD_VARIANT || 'assembleDebug' }} \
                    -PversionName=${{ env.VERSION_PROYECTO }}
                    
      # -------------------------------------------------------------------
      # PASO 8: CAPTURA Y SUBIDA DE LOGS Y REPORTS TÉCNICOS
      # Recoge de forma recursiva todos los reports de rendimiento e informes.
      # Usamos 'if: always()' para asegurar que este ZIP se genere SIEMPRE,
      # permitiéndote auditar los logs incluso si la compilación falló.
      # -------------------------------------------------------------------
      - name: Guardar Informes de Compilación (Logs & Reports)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reports-and-compilacion-logs  # ZIP reports-and-compilacion-logs
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: warn    # Avisará con un warning si no hay reports/logs

      # -------------------------------------------------------------------
      # PASO 9: CAPTURA Y SUBIDA DE LOS ARCHIVOS APK
      # Busca cualquier archivo .apk generado de forma recursiva en el proyecto.
      # Se ejecuta solo si la compilación tuvo éxito (success).
      # -------------------------------------------------------------------
      - name: Guardar la Aplicación Compilada (Solo APK)
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: app-virtual-device-apk  # ZIP app-virtual-device-apk
          path: "**/*.apk"
          if-no-files-found: error      # Si no encuentra el APK, el workflow marcará error

          
