# # =========================================================================
# # NOMBRE DEL WORKFLOW DE COMPILACIÓN
# # Se mostrará con este título en la pestaña "Actions" de tu repositorio.
# # =========================================================================
# <name: Integración Continua (Compilación)
# # El trigger se activa al hacer push/pull sobre la rama principal (el trigger vigila cambios en cualquier punto de la rama)
# # (en particular se activará cuando el bot del unzip termine el push de subir los archivos descomprimidos)
# on:
#   push:
#     branches: [ "main" ]  # Ejecuta este workflow cada vez que alguien suba código "definitivo" (push) a la rama main
#   pull_request:
#     branches: [ "main" ]  # Ejecuta este workflow cuando alguien proponga cambios a través de un Pull Request dirigido hacia la rama main


# =========================================================================
# NOMBRE DEL WORKFLOW DE COMPILACIÓN
# Se mostrará con este título en la pestaña "Actions" de tu repositorio.
# =========================================================================
name: Compilación Manual del Proyecto

# =========================================================================
# TRIGGER MANUAL CON EL ÚNICO INPUT INTERACTIVO REQUERIDO
# Mantenemos exclusivamente el checkbox para forzar el borrado de la caché.
# Los demás parámetros técnicos quedan fijos de fondo de forma persistente.
# =========================================================================
on:
  workflow_dispatch:
    inputs:
      clear_cache:
        description: 'Marcar para FORZAR el borrado de la caché y compilar en limpio desde cero'
        required: false
        type: boolean
        default: false

# =========================================================================
# PARAMETROS FIJOS PERSISTENTES (VARIABLES DE ENTORNO GLOBALES)
# Centralizamos aquí los parámetros que cambies rara vez y viajen en el código.
# Variable env, se ven en todos los steps del script
# =========================================================================
env:
  VERSION_PROYECTO: "1.5.0-stable"    
  # WORKING_DIR: "."                         # Modificar si se usa una subcarpeta para contener el proyecto kotlin
  WORKING_DIR: "Matter_Virtual_Device"     # Modificar si se usa una subcarpeta para contener el proyecto kotlin
                                           # El punto (.) es buscar el proyecto directamente en la raíz (que es
                                           # lo que hace gradle por defecto)
  SKIP_JDK_VERSION_CHECK: "true"           # sdkmanager ignorará que estás en JDK 11 y procederá a aceptar las licencias
                                           # de tu SDK Platform 26 de forma limpia                                    

# =========================================================================
# ENTORNOS DE COMPILACIÓN Y PASOS EXECUTADOS POR EL RUNNER
# Configura el entorno base heredado: JDK 11, Android SDK API 26 y NDK r22b.
# =========================================================================
jobs:
  build:
    # Solicitamos a GitHub un runner limpio basado en una máquina virtual Linux (Ubuntu).
    runs-on: ubuntu-latest

    # -------------------------------------------------------------------
    # CONFIGURACIÓN GLOBAL DE DEFAULTS
    # Forzamos a que todos los comandos 'run' de este job se ejecuten de forma
    # automática dentro de la carpeta fijada arriba en ${{ env.WORKING_DIR }}.
    # Si no estuviese aquí habría que ponerlo en cada run de Gradle
    # -------------------------------------------------------------------
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      # -------------------------------------------------------------------
      # PASO 1: ACCIÓN DE CHECKOUT (DESCARGA DEL REPOSITORIO)
      # Clona el código de tu rama principal dentro del entorno del runner.
      # -------------------------------------------------------------------
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      # -------------------------------------------------------------------
      # PASO 2: INSTALACIÓN INICIAL DE JAVA 17
      # Necesario exclusivamente para que las herramientas del SDK de Android 
      # (sdkmanager) no arrojen errores de LinkageError al validar licencias.
      # -------------------------------------------------------------------
      - name: Configurar Java JDK 17 (Para herramientas de Android)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'


      # # -------------------------------------------------------------------
      # # PASO 3: CONFIGURACIÓN DEL ANDROID SDK Y EL NDK EXACTO
      # # Descarga y asocia la plataforma API 26 junto al NDK 22.1.7171670 (r22b).
      # # Mapea automáticamente variables críticas del sistema como ANDROID_HOME.
      # # -------------------------------------------------------------------
      # - name: Configurar Android SDK y NDK (Estilo v2)
      #   uses: android-actions/setup-android@v2
      #   with:
      #     api-level: 26
      #     ndk-version: 22.1.7171670

      # -------------------------------------------------------------------
      # PASO 3: CONFIGURACIÓN DEL ANDROID SDK Y EL NDK EXACTO (SINTAXIS V3 --setup-android@v3--)
      # Forzamos la aceptación automática de licencias para que el bot no se detenga.
      # Usamos el parámetro unificado 'packages' y su nomenclatura para descargar la API 26 y el NDK.
      # -------------------------------------------------------------------
      - name: Configurar Android SDK y NDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: >-
            platforms;android-26
            ndk;22.1.7171670
            
          #packages: 'platforms;android-26 ndk;22.1.7171670' <--- Nomenclatura alternativa 
          
      # -------------------------------------------------------------------
      # PASO 4: DOWNGRADE SEGURO A JAVA JDK 11 (TU ENTORNO REQUERIDO)
      # Modificamos el entorno de la máquina virtual para restaurar Java 11.
      # Activamos aquí tu caché condicional para agilizar tus futuros builds.
      # -------------------------------------------------------------------
      - name: Configurar Java JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          # =======================================================================
          # NOTA ARQUITECTURA DISTRIBUCIÓN:
          # Elegimos 'temurin' (Eclipse Adoptium) por ser la distribución recomendada
          # de GitHub para la action 'setup-java', ya que con ella la caché de Gradle se
          # integra de forma nativa con esta distribución. 
          #
          # Alternativas válidas si Gradle da errores heredados de compatibilidad: 
          # 'zulu' (Azul Systems, recomendada para entornos Android clásicos),
          # 'corretto' (Amazon), 'microsoft' o 'liberica'.
          # =====================================================================          
          distribution: 'temurin'
          cache: ${{ github.event.inputs.clear_cache == 'true' && '' || 'gradle' }}
          
      # -------------------------------------------------------------------
      # PASO 5: PERMISOS DE EJECUCIÓN AL WRAPPER DE GRADLE
      # Los sistemas Linux (como el runner) exigen permisos explícitos para
      # poder arrancar scripts binarios ejecutables.
      # Gracias al default global, Linux buscará './gradlew' dentro de tu WORKING_DIR.
      # -------------------------------------------------------------------
      # 
      # NOTA DIDACTICA SOBRE EL GRADLE WRAPPER (gradlew):
      # Usamos el script ejecutable './gradlew' del propio proyecto en lugar de
      # acciones como 'setup-gradle' porque el Wrapper encapsula la versión exacta 
      # de Gradle necesaria, garantizando la compatibilidad con Java 11.
      # El Wrapper es un script autoejecutable que ya lleva dentro la versión exacta 
      # de Gradle que necesita la aplicación. Es el propio Wrapper el que se descarga 
      # su motor de ejecución de Gradle (en ~/.gradle/) y compila el código.
      # (el runner ~/.gradle/ = /home/runner/.gradle/)
      # =======================================================================      
      - name: Otorgar permisos de ejecución a gradlew
        run: chmod +x gradlew

      # -------------------------------------------------------------------
      # PASO 6a: DIAGNÓSTICO NATIVO DE LA VERSIÓN DE KOTLIN
      # Le pedimos directamente a Gradle que escanee sus plugins cargados
      # y nos pinte en pantalla la versión de Kotlin exacta del proyecto.
      # -------------------------------------------------------------------
      - name: Consultar versión de Kotlin detectada por Gradle
        run: ./gradlew buildEnvironment

      # -------------------------------------------------------------------
      # PASO 6b: DIAGNÓSTICO INTERMEDIO - CONDICIONAL INTELIGENTE
      # Gracias a 'if: vars.BUILD_VARIANT == ...', este paso completo se saltará 
      # de forma transparente a menos que actives explícitamente la auditoría en la web.
      # -------------------------------------------------------------------
      - name: Inyectar configuración de análisis estático debugUsage
        if: vars.BUILD_VARIANT == 'assembleDebugUsage'
        run: |
          echo "============================================================="
          echo "⚡ INICIANDO INYECCIÓN DINÁMICA EN EL SERVER..."
          echo "============================================================="
          
          # 1. Creamos el archivo de reglas proguard-usage-rules.pro en la carpeta del módulo app
          cat << 'EOF' > app/proguard-usage-rules.pro
          # Reglas de Auditoría Estática Autogeneradas por GitHub Actions
          -dontobfuscate
          -dontshrink
          -dontoptimize
          -printusage build/outputs/mapping/debugUsage/usageJARs_ProGuardR8.txt
          EOF
          echo "✅ Archivo app/proguard-usage-rules.pro creado con éxito."
          
          # 2. Inyectamos la build variant debugUsage dentro del bloque buildTypes de build.gradle.kts
          VARIANT_CONTENT="\n        create(\"debugUsage\") {\
                           \n            initWith(getByName(\"debug\"))\
                           \n            isMinifyEnabled = true\
                           \n            matchingFallbacks.add(\"debug\")\
                           \n            proguardFiles(\
                           \n                getDefaultProguardFile(\"proguard-android-optimize.txt\"),\
                           \n                \"proguard-rules.pro\",\
                           \n                \"proguard-usage-rules.pro\"\
                           \n            )\
                           \n        }"

          # 3. Inyectamos el texto estructurado usando awk con VARIANT_CONTENT
          #    Se inyecta el código en la llave de cierre final de buildTypes
          # - /buildTypes \{/ ➔ Despierta el rastreador e inicializa la pila a 1.
          # - gsub(/{/, "{") ➔ Cuenta las aperturas en la línea y las suma al balance.
          # - gsub(/\}/, "}") ➔ Cuenta los cierres en la línea y los resta al balance.
          # - balance == 0 ➔ Encontró el fin absoluto de buildTypes. Inyecta tu bloque.
          awk -v block="$VARIANT_CONTENT" '
            # 1. Localizamos el inicio de buildTypes. Lo imprimimos intacto e iniciamos la pila.
            /buildTypes \{/ { print; tracking=1; balance=1; next }
            
            tracking {
              # Clonamos la línea en una variable temporal para contar sin alterar el texto original
              line_copy = $0
              open_braces = gsub(/\{/, "{", line_copy)
              close_braces = gsub(/\}/, "}", line_copy)
              
              balance += (open_braces - close_braces)
              
              if (balance == 0) {
                # Al llegar a cero, la línea actual contiene el "}" de buildTypes.
                # Para inyectar ANTES de ese cierre, volcamos primero el bloque debugUsage
                print block
                
                # Ahora imprimimos la línea original intacta (que contiene el "}" de cierre con su sangría real)
                print $0
                tracking=0
                next
              }
            }
            
            # Imprime de forma normal cualquier línea que no cumpla las condiciones anteriores
            { print }
          ' app/build.gradle.kts > app/build.gradle.kts.tmp
          
          mv app/build.gradle.kts.tmp app/build.gradle.kts
          echo "✅ Estructura debugUsage acoplada con éxito en build.gradle.kts."
          echo "============================================================="
          
      # -------------------------------------------------------------------
      # PASO 6c: DIAGNÓSTICO INTERMEDIO - ANÁLISIS DINÁMICO DE HOJA DE RUTA JAR
      # Descubre de forma automatizada la carpeta de librerías leyendo el archivo
      # build.gradle.kts, audita TODOS los archivos .jar presentes en ella de golpe
      # y vuelca el reporte detallado de referencias cruzadas con tu código.
      # -------------------------------------------------------------------
      - name: Auditar referencias cruzadas con librerías JAR
        run: |
          python3 -c '
          import os, zipfile, re

          # 1. Localizar de forma dinámica el archivo build.gradle.kts principal
          gradle_file = None
          for root, dirs, files in os.walk("."):
              if "build.gradle.kts" in files and "app" in root:
                  gradle_file = os.path.join(root, "build.gradle.kts")
                  break

          if not gradle_file:
              print("❌ No se localizó el archivo build.gradle.kts del módulo app.")
              exit(1)

          print(f"📄 Analizando archivo de configuración: {gradle_file}")
          
          # 2. Leer build.gradle.kts para auto-descubrir el directorio de los JARs (fileTree)
          libs_dir_name = "libs" # Valor por defecto seguro
          with open(gradle_file, "r", encoding="utf-8") as g:
              content = g.read()
              # Buscamos patrones como "dir" to "nombre_carpeta"
              match = re.search(r"\"dir\"\s+to\s+\"([^\"]+)\"", content)
              if match:
                  libs_dir_name = match.group(1)
          
          # Construimos la ruta física real hacia esa carpeta de librerías
          app_dir = os.path.dirname(gradle_file)
          target_libs_path = os.path.join(app_dir, libs_dir_name)

          if not os.path.exists(target_libs_path):
              print(f"🔍 [Aviso] La carpeta auto-descubierta {target_libs_path} no existe físicamente en el repositorio.")
              exit(0)

          print(f"📁 Directorio de librerías auto-descubierto con éxito: {target_libs_path}")
          
          # 3. Escanear TODOS los archivos .jar que vivan en esa carpeta descubierta
          all_jars = [os.path.join(target_libs_path, f) for f in os.listdir(target_libs_path) if f.endswith(".jar")]
          
          if not all_jars:
              print("❌ No se encontraron archivos .jar dentro de la carpeta de soporte.")
              exit(0)

          print(f"📦 Total de archivos JAR detectados para auditoría masiva: {[os.path.basename(j) for j in all_jars]}")
          
          # 4. Mapear los paquetes lógicos de TODOS los JARs encontrados
          packages_map = {} # Estructura: {"chip.platform": "AndroidPlatform.jar"}
          for jar in all_jars:
              jar_name = os.path.basename(jar)
              with zipfile.ZipFile(jar, "r") as z:
                  for name in z.namelist():
                      if name.endswith(".class"):
                          parts = name.split("/")
                          if len(parts) > 1:
                              pkg = ".".join(parts[:-1])
                              # Vinculamos qué paquete pertenece a qué archivo físico JAR
                              packages_map[pkg] = jar_name

          print("-" * 70)
          print("📊 REPORTE DE REFERENCIAS CRUZADAS ENCONTRADAS EN TU CÓDIGO:")
          print("-" * 70)

          # 5. Rastrear esas firmas en tus ficheros de código de desarrollo (.kt o .java)
          matches_count = 0
          for root, dirs, files in os.walk("."):
              if "build" in root or ".gradle" in root:
                  continue
              for f in files:
                  if f.endswith((".kt", ".java")):
                      file_path = os.path.join(root, f)
                      try:
                          with open(file_path, "r", encoding="utf-8") as src:
                              for line_num, line in enumerate(src, 1):
                                  for pkg, origin_jar in packages_map.items():
                                      if pkg in line and not line.strip().startswith("//"):
                                          print(f"• File: {file_path} (Línea {line_num})")
                                          print(f"  ↳ Origen: Proveniente del archivo [{origin_jar}]")
                                          print(f"  ↳ Código: {line.strip()}\n")
                                          matches_count += 1
                      except Exception:
                          pass

          print("-" * 70)
          print(f"✅ Auditoría finalizada. Se detectaron {matches_count} llamadas reales de tu código hacia el catálogo completo de JARs.")
          print("=============================================================")
          '
      
      # -------------------------------------------------------------------
      # PASO 7: EJECUCIÓN DE LA COMPILACIÓN CON PARÁMETROS PERSISTENTES
      # - Mapeamos la variante leyendo la variable FIJA de los Ajustes web: vars.BUILD_VARIANT
      # - Mapeamos la versión leyendo el parámetro FIJO de la sección env: env.VERSION_PROYECTO
      # -------------------------------------------------------------------
      - name: Compilar con Gradle
        run: |
          # 1. Usamos una variante de compilación para indicar la tarea que pedimos a gradlew que compile.
          # 2. El flag -P sirve para inyectar una variable Gradle personalizada desde la línea de comandos hacia los build.gradle.
          # 3. '-PversionName=...' crea o sobrescribe una variable Gradle llamada versionName.
          # 4. Añadimos '--profile' para forzar a Gradle a generar el reporte HTML de rendimiento interactivo (en la carpeta **/build/reports/profile/).
          ./gradlew ${{ vars.BUILD_VARIANT || 'assembleDebug' }} \
                    -PversionName=${{ env.VERSION_PROYECTO }} \
                    --profile




      # -------------------------------------------------------------------
      # PASO 7.5: INYECCIÓN DE ACCESO DIRECTO VISUAL AL PROFILE REPORT
      # Localiza el archivo HTML dinámico generado por la bandera '--profile'
      # (HTML de rendimiento) y lo publica en la interfaz web de GitHub Actions      
      # usando Job Summaries.
      # -------------------------------------------------------------------
      - name: Crear Acceso Directo al Reporte de Rendimiento
        if: always()
        run: |
          echo "============================================================="
          echo "📸 [AUTO-AUDITORÍA] VOLCANDO EL CÓDIGO FUENTE DEL SCRIPT INTERNO:"
          echo "============================================================="
          cat "\$0"
          echo "============================================================="
          echo "🌐 BUSCANDO REPORTE DE PERFILADO INTERACTIVO..."
          echo "============================================================="
          
          # Localizamos el archivo HTML de forma dinámica en la subcarpeta build
          PROFILE_HTML=`find . -name "profile-*.html" | head -n 1`
          
          if [ -n "\$PROFILE_HTML" ]; then
            echo "📊 Reporte localizado en: \$PROFILE_HTML" 
            
            # Extraemos el nombre base en una variable aislada para evitar el error de token '('
            FILE_NAME="\${PROFILE_HTML##*/}"
            
            # 1. Copiamos el archivo a una ruta predecible y fija para que GitHub lo exponga como Artifact independiente
            mkdir -p app/build/outputs/profile_directo
            cp "\$PROFILE_HTML" app/build/outputs/profile_directo/index.html
            
            # 2. Escribimos un enlace de texto enriquecido Markdown en el Job Summary global de la web
            echo "### 📊 Diagnóstico Interactivo de Gradle" >> \$GITHUB_STEP_SUMMARY
            echo "¡Tu reporte de rendimiento e interactividad de tareas ya está listo!" >> \$GITHUB_STEP_SUMMARY
            echo "Puedes consultarlo de forma directa haciendo clic en el apartado de descargas o abriendo el visualizador." >> \$GITHUB_STEP_SUMMARY
            echo "• **Archivo original:** \$FILE_NAME" >> \$GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No se generó ningún reporte de perfilado HTML en esta ejecución."
            echo "### ⚠️ Aviso de Perfilado" >> \$GITHUB_STEP_SUMMARY
            echo "No se localizó el archivo de rendimiento HTML. Asegúrate de compilar usando la bandera --profile." >> \$GITHUB_STEP_SUMMARY
          fi
          echo "============================================================="

      # -------------------------------------------------------------------
      # PASO 7.6: PUBLICACIÓN DEL PROFILE COMO ARTIFACT WEB NATIVO
      # Subimos el HTML de forma aislada sin comprimir. Esto permite que la
      # interfaz web de GitHub lo renderice con un enlace de visualización directa.
      # -------------------------------------------------------------------
      - name: Publicar Visualizador HTML Directo
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: visualizador-profile-interactivo  # Nombre de la pestaña de visualización directa
          path: app/build/outputs/profile_directo/index.html
          if-no-files-found: warn
          
      # -------------------------------------------------------------------
      # PASO 8: CAPTURA Y SUBIDA DE LOGS Y REPORTS TÉCNICOS
      # Recoge de forma recursiva todos los reports de rendimiento e informes.
      # Usamos 'if: always()' para asegurar que este ZIP se genere SIEMPRE,
      # permitiéndote auditar los logs incluso si la compilación falló.
      # -------------------------------------------------------------------
      - name: Guardar Informes de Compilación (Logs & Reports)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reports-and-compilacion-logs  # ZIP reports-and-compilacion-logs
          path: |
            **/build/reports/
            **/build/outputs/logs/
            **/build/outputs/reports/
            **/build/outputs/mapping/
          if-no-files-found: warn    # Avisará con un warning si no hay reports/logs

      # -------------------------------------------------------------------
      # PASO 9: CAPTURA Y SUBIDA DE LOS ARCHIVOS APK
      # Busca cualquier archivo .apk generado de forma recursiva en el proyecto.
      # Se ejecuta solo si la compilación tuvo éxito (success).
      # -------------------------------------------------------------------
      - name: Guardar la Aplicación Compilada (Solo APK)
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: app-virtual-device-apk  # ZIP app-virtual-device-apk
          path: "**/*.apk"
          if-no-files-found: error      # Si no encuentra el APK, el workflow marcará error

          
